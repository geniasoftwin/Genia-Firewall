name: Bug report
description: Report a reproducible GeniaFirewall defect
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Use the private process in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: GeniaFirewall version
      placeholder: 0.7.3.4
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - GeniaFirewall WFP
        - Windows Firewall Compatibility
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Remove credentials, personal paths, IPs, and unrelated logs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
