name: Compatibility report
description: Share a Windows, LAN, VPN, TUN, or application compatibility result
title: "[Compatibility] "
labels: [compatibility]
body:
  - type: input
    id: version
    attributes:
      label: GeniaFirewall version
      placeholder: 0.7.4 RC3
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 10 22H2 x64
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - GeniaFirewall WFP
        - Windows Firewall Compatibility
    validations:
      required: true
  - type: input
    id: software
    attributes:
      label: Software / scenario tested
      placeholder: LAN file transfer / WireGuard / Wintun / browser / game
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Test setup
      description: Describe the rule profile, direction, protocol, and relevant network topology without exposing private data.
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works as expected
        - Partially works
        - Does not work
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / diagnostics
      description: Optional redacted details that may help reproduce the result.
