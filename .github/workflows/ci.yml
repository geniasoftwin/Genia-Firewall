name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GeniaFirewall.sln

      - name: Build
        run: dotnet build GeniaFirewall.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Publish and verify single-EXE portable package
        shell: cmd
        run: publish-portable.cmd

      - name: Upload Windows test package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GeniaFirewall-0.7.4-RC1-SingleExe-Portable-win-x64
          path: |
            publish/GeniaFirewall-0.7.4-RC1-SingleExe-Portable-win-x64.zip
            publish/GeniaFirewall-0.7.4-RC1-SHA256.txt
          if-no-files-found: error
          retention-days: 14
